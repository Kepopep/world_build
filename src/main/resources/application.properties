spring.application.name=worldBuilding

# ===============================
# DB / PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/worldBuilding
spring.datasource.username=postgres
spring.datasource.password=hisder
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# OpenAPI
# ===============================

springdoc.api-docs.path=/openapi

# ===============================
# DevTools (local hot reload)
# ===============================

spring.devtools.restart.enabled=true

# ===============================
# AI generation
# ===============================
# Provider-agnostic: base-url must point at any OpenAI-compatible
# chat/completions aggregator (e.g. OpenRouter), not a specific vendor.
# Never commit real values -- set these as environment variables instead.
# Only OpenAI models are ever exposed/accepted (see
# AiGenerationService.isOpenAiModel/isOpenAiModelId) -- AI_AGGREGATOR_MODELS
# fallback ids must be vendor-prefixed ("openai/gpt-4o") to be recognized.

ai.aggregator.base-url=${AI_AGGREGATOR_BASE_URL:}
ai.aggregator.api-key=${AI_AGGREGATOR_API_KEY:}
ai.aggregator.models=${AI_AGGREGATOR_MODELS:}