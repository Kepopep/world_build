<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Building - Relation Graph</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link rel="stylesheet" href="graph-visualization.css">
</head>
<body>
<div class="app">

    <!-- ============ TOP NAVBAR ============ -->
    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="entry-view.html" title="К иерархии сущностей">
                <span class="brand-icon">◆</span>
                <span class="brand-name">Миры</span>
            </a>
            <div class="world-switcher" id="worldSwitcher">
                <span class="world-name" id="worldName">Все миры</span>
                <span class="chevron">⌄</span>
                <div class="world-dropdown" id="worldDropdown" hidden></div>
            </div>
        </div>

        <div class="topbar-center">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Найти сущность на графе...">
            </div>
        </div>

        <div class="topbar-right">
            <button class="icon-btn" id="themeToggle" title="Сменить тему">☀</button>
        </div>
    </header>

    <!-- ============ TOOLBAR ============ -->
    <div class="toolbar">
        <button class="toolbar-btn" id="refreshBtn" title="Обновить граф">⟳ Обновить</button>
        <button class="toolbar-btn" id="resetZoomBtn" title="Сбросить масштаб">⤢ Масштаб</button>
        <button class="toolbar-btn" id="centerBtn" title="Центрировать">🎯 Центр</button>
        <button class="toolbar-btn" id="physicsBtn" title="Включить/выключить физику">⚛ Физика</button>

        <div id="neighborhoodChip" hidden></div>

        <div class="toolbar-spacer"></div>

        <span style="font-size: 12.5px; color: var(--text-faint);">Правый клик по сущности или пустому месту — меню действий</span>
    </div>

    <!-- ============ GRAPH CANVAS ============ -->
    <div class="graph-container" id="graphContainer">
        <div class="loading">
            <div class="spinner"></div>
            Загрузка графа...
        </div>
    </div>

    <!-- ============ STATS ============ -->
    <div class="stats" id="stats" style="display: none;">
        <div class="stat">
            <span>Сущностей:</span>
            <span class="stat-value" id="statEntries">0</span>
        </div>
        <div class="stat">
            <span>Связей:</span>
            <span class="stat-value" id="statRelations">0</span>
        </div>
        <div class="stat">
            <span>Ср. кол-во связей:</span>
            <span class="stat-value" id="statAvgDegree">0</span>
        </div>
    </div>
</div>

<div class="link-hint" id="linkHint">Выберите вторую сущность, чтобы создать связь. Esc — отмена.</div>
<div class="tooltip" id="tooltip"></div>
<div class="context-menu" id="contextMenu" hidden></div>

<div class="toast" id="toast"></div>

<!-- ============ CREATE / EDIT ENTRY MODAL ============ -->
<div class="modal-overlay" id="entryModalOverlay" hidden>
    <div class="modal">
        <div class="modal-header">
            <h2 id="entryModalTitle">Создать сущность</h2>
            <button type="button" class="icon-btn" id="entryModalCloseBtn" title="Закрыть">✕</button>
        </div>
        <form id="entryModalForm" class="modal-body">
            <label class="field">
                <span class="field-label">Название</span>
                <input type="text" id="entryFieldName" required maxlength="200">
            </label>
            <label class="field">
                <span class="field-label">Титул / подзаголовок</span>
                <input type="text" id="entryFieldTitle" required maxlength="300">
            </label>
            <label class="field">
                <span class="field-label">Тип</span>
                <select id="entryFieldType"></select>
            </label>
            <label class="field">
                <span class="field-label">Мир</span>
                <select id="entryFieldWorld"></select>
            </label>
            <label class="field">
                <span class="field-label">Родитель</span>
                <select id="entryFieldParent"></select>
            </label>
            <label class="field">
                <span class="field-label">Описание</span>
                <textarea id="entryFieldDescription" rows="5"></textarea>
            </label>
            <div class="field-error" id="entryFieldError" hidden></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="entryModalCancelBtn">Отмена</button>
                <button type="submit" class="btn-primary" id="entryModalSubmitBtn">Создать</button>
            </div>
        </form>
    </div>
</div>

<!-- ============ CREATE WORLD MODAL ============ -->
<div class="modal-overlay" id="worldModalOverlay" hidden>
    <div class="modal modal-small">
        <div class="modal-header">
            <h2>Создать мир</h2>
            <button type="button" class="icon-btn" id="worldModalCloseBtn" title="Закрыть">✕</button>
        </div>
        <form id="worldModalForm" class="modal-body">
            <label class="field">
                <span class="field-label">Название мира</span>
                <input type="text" id="worldFieldName" required maxlength="200">
            </label>
            <div class="field-error" id="worldFieldError" hidden></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="worldModalCancelBtn">Отмена</button>
                <button type="submit" class="btn-primary">Создать</button>
            </div>
        </form>
    </div>
</div>

<!-- ============ CONFIRM RELATION MODAL (used by drag-to-link context menu flow) ============ -->
<div class="modal-overlay" id="relationModalOverlay" hidden>
    <div class="modal modal-small">
        <div class="modal-header">
            <h2>Создать связь</h2>
            <button type="button" class="icon-btn" id="relationModalCloseBtn" title="Закрыть">✕</button>
        </div>
        <form id="relationModalForm" class="modal-body">
            <div class="relation-summary" id="relationSummary"></div>

            <label class="field">
                <span class="field-label">Тип связи</span>
                <select id="relationFieldDefinition"></select>
            </label>

            <button type="button" class="link-toggle" id="relationNewDefinitionToggle">+ Новый тип связи</button>

            <div id="relationNewDefinitionFields" hidden>
                <label class="field">
                    <span class="field-label">Название (например «правит»)</span>
                    <input type="text" id="relationFieldDefName" maxlength="100">
                </label>
                <label class="field">
                    <span class="field-label">Обратное название (например «управляется»)</span>
                    <input type="text" id="relationFieldDefReverseName" maxlength="100">
                </label>
            </div>

            <div class="field-error" id="relationFieldError" hidden></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="relationModalCancelBtn">Отмена</button>
                <button type="submit" class="btn-primary" id="relationModalSubmitBtn">Создать связь</button>
            </div>
        </form>
    </div>
</div>

<script src="graph-visualization.js"></script>
</body>
</html>
