<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header id="top-bar">
    <span class="wordmark">Mythos</span>

    <label for="world-select">World:</label>
    <select id="world-select"></select>

    <input id="new-world-name" type="text" placeholder="New world name">
    <button id="new-world-btn" type="button">Create world</button>

    <span id="status-message" role="status"></span>
  </header>

  <main id="app-shell">
    <aside id="entry-sidebar">
      <div class="sidebar-header">
        <h2>Entries</h2>
        <button id="new-entry-btn" type="button">+ New entry</button>
      </div>
      <ul id="entry-list"></ul>
    </aside>

    <section id="content-panel">
      <p id="editor-empty">Select an entry, or create a new one, to start editing.</p>

      <div id="editor" hidden>
        <div class="content-toolbar">
          <button id="edit-toggle-btn" type="button" class="icon-btn" aria-pressed="false" title="Edit" aria-label="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
          <button id="save-btn" type="button" class="icon-btn" title="Save" aria-label="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
          <button id="delete-btn" type="button" class="icon-btn danger" title="Delete" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
        <input id="entry-title" type="text" placeholder="Entry title" readonly>
        <div id="entry-content-wrapper">
          <div id="entry-content-overlay" aria-hidden="true"></div>
          <textarea id="entry-content" placeholder="Write markdown here..." spellcheck="false" readonly></textarea>
        </div>
        <div id="wikilink-autocomplete" hidden></div>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
