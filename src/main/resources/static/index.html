<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/tags.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/graph.css">
</head>
<body>
  <header id="top-bar">
    <span class="wordmark">Mythos</span>

    <label for="world-select">World:</label>
    <select id="world-select"></select>

    <input id="new-world-name" type="text" placeholder="New world name">
    <button id="new-world-btn" type="button">Create world</button>

    <button id="world-graph-btn" type="button">Graph view</button>

    <span id="status-message" role="status"></span>
  </header>

  <main id="app-shell">
    <aside id="entry-sidebar">
      <div class="sidebar-header">
        <h2>Entries</h2>
        <button id="new-folder-btn" type="button">+ Folder</button>
        <button id="new-entry-btn" type="button">+ New entry</button>
      </div>
      <ul id="entry-tree"></ul>
    </aside>

    <section id="content-panel">
      <p id="editor-empty">Select an entry, or create a new one, to start editing.</p>

      <div id="editor" hidden>
        <div id="breadcrumb"></div>
        <div class="content-toolbar">
          <button id="edit-toggle-btn" type="button" class="icon-btn" aria-pressed="false" title="Edit" aria-label="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
          <button id="save-btn" type="button" class="icon-btn" title="Save" aria-label="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
          <button id="delete-btn" type="button" class="icon-btn danger" title="Delete" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
          <button id="entry-graph-btn" type="button" class="icon-btn" title="Entry graph" aria-label="Entry graph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="6" x2="12" y2="18"></line>
              <line x1="12" y1="18" x2="18" y2="6"></line>
              <line x1="6" y1="6" x2="18" y2="6"></line>
              <circle cx="6" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <circle cx="18" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <div id="markdown-toolbar" class="markdown-toolbar">
            <button type="button" class="icon-btn" data-md-action="undo" title="Undo" aria-label="Undo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 14 4 9 9 4"></polyline>
                <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="redo" title="Redo" aria-label="Redo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 14 20 9 15 4"></polyline>
                <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
              </svg>
            </button>
            <select id="heading-select" data-md-heading title="Block style" aria-label="Block style">
              <option value="0">Normal</option>
              <option value="1">Heading 1</option>
              <option value="2">Heading 2</option>
              <option value="3">Heading 3</option>
            </select>
            <button type="button" class="icon-btn" data-md-action="bold" title="Bold" aria-label="Bold">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="italic" title="Italic" aria-label="Italic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="4" x2="10" y2="4"></line>
                <line x1="14" y1="20" x2="5" y2="20"></line>
                <line x1="15" y1="4" x2="9" y2="20"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="underline" title="Underline" aria-label="Underline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
                <line x1="4" y1="21" x2="20" y2="21"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="strikethrough" title="Strikethrough" aria-label="Strikethrough">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 4H9a3 3 0 0 0-2.83 4"></path>
                <path d="M14 12a4 4 0 0 1 0 8H6"></path>
                <line x1="4" y1="12" x2="20" y2="12"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="link" title="Link" aria-label="Link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="image" title="Image" aria-label="Image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="bullet-list" title="Bulleted list" aria-label="Bulleted list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="9" y1="6" x2="20" y2="6"></line>
                <line x1="9" y1="12" x2="20" y2="12"></line>
                <line x1="9" y1="18" x2="20" y2="18"></line>
                <line x1="4" y1="6" x2="4.01" y2="6"></line>
                <line x1="4" y1="12" x2="4.01" y2="12"></line>
                <line x1="4" y1="18" x2="4.01" y2="18"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="numbered-list" title="Numbered list" aria-label="Numbered list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="10" y1="6" x2="21" y2="6"></line>
                <line x1="10" y1="12" x2="21" y2="12"></line>
                <line x1="10" y1="18" x2="21" y2="18"></line>
                <path d="M4 6h1v4"></path>
                <path d="M4 10h2"></path>
                <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="blockquote" title="Blockquote" aria-label="Blockquote">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 7h4v4a4 4 0 0 1-4 4H6"></path>
                <path d="M15 7h4v4a4 4 0 0 1-4 4h-1"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="inline-code" title="Inline code" aria-label="Inline code">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="code-block" title="Code block" aria-label="Code block">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <polyline points="9 9 7 12 9 15"></polyline>
                <polyline points="15 9 17 12 15 15"></polyline>
              </svg>
            </button>
          </div>
        </div>
        <input id="entry-title" type="text" placeholder="Entry title" readonly>
        <div id="entry-tags"></div>

        <div id="entry-content-wrapper">
          <div id="entry-content-overlay" aria-hidden="true"></div>
          <textarea id="entry-content" placeholder="Write markdown here..." spellcheck="false" readonly></textarea>
        </div>
        <div id="entry-content-preview" class="markdown-preview" hidden></div>
        <div id="editor-footer">
          <span>Markdown</span>
          <span aria-hidden="true"> · </span>
          <span id="editor-word-count">0 words</span>
        </div>
        <div id="wikilink-autocomplete" hidden></div>
      </div>
    </section>
  </main>

  <div id="graph-modal" class="modal-overlay" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="graph-modal-title"></h2>
        <button id="graph-modal-close" type="button" class="icon-btn" aria-label="Close">×</button>
      </div>
      <svg id="graph-canvas"></svg>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/wikilink-parser.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
