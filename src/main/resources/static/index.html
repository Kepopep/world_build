<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/tags.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/rail.css">
  <link rel="stylesheet" href="css/outline.css">
  <link rel="stylesheet" href="css/backlinks.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/link-preview.css">
</head>
<body>
  <header id="top-bar">
    <span class="wordmark">Mythos</span>

    <label for="world-select">World:</label>
    <select id="world-select"></select>

    <input id="new-world-name" type="text" placeholder="New world name">
    <button id="new-world-btn" type="button">Create world</button>

    <div id="top-search">
      <input id="search-input" type="text" placeholder="Search in current world..." autocomplete="off" aria-label="Search in current world">
      <div id="search-results" hidden></div>
    </div>

    <button id="world-graph-btn" type="button">Graph view</button>

    <button id="theme-toggle-btn" type="button" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>

    <span id="status-message" role="status"></span>
  </header>

  <main id="app-shell">
    <nav id="left-rail" aria-label="View switcher">
      <button id="rail-notes-btn" type="button" class="rail-btn active" data-rail-mode="notes" title="Notes" aria-label="Notes view" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="8" y1="13" x2="16" y2="13"></line>
          <line x1="8" y1="17" x2="16" y2="17"></line>
        </svg>
      </button>
      <button id="rail-graph-btn" type="button" class="rail-btn" data-rail-mode="graph" title="Graph" aria-label="World graph view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" y1="6" x2="12" y2="18"></line>
          <line x1="12" y1="18" x2="18" y2="6"></line>
          <line x1="6" y1="6" x2="18" y2="6"></line>
          <circle cx="6" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <circle cx="18" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <button id="rail-settings-btn" type="button" class="rail-btn" title="Settings (coming soon)" aria-label="Settings (coming soon)" disabled aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </nav>

    <aside id="entry-sidebar">
      <div class="sidebar-header">
        <h2>Entries</h2>
        <button id="new-folder-btn" type="button">+ Folder</button>
        <button id="new-entry-btn" type="button">+ New entry</button>
        <button id="generate-ai-btn" type="button">✨ Generate with AI</button>
      </div>
      <div id="ai-generate-form" hidden>
        <textarea id="ai-generate-prompt" placeholder="Describe the entry to generate..."></textarea>
        <input id="ai-generate-model-search" type="text" placeholder="Search models..." aria-label="Search AI models">
        <select id="ai-generate-model" aria-label="AI model"></select>
        <div id="ai-generate-actions">
          <button id="ai-generate-submit-btn" type="button">Generate</button>
          <button id="ai-generate-cancel-btn" type="button">Cancel</button>
        </div>
        <span id="ai-generate-status" role="status"></span>
      </div>
      <ul id="entry-tree"></ul>
    </aside>

    <section id="content-panel">
      <p id="editor-empty">Select an entry, or create a new one, to start editing.</p>

      <div id="editor" hidden>
        <div id="breadcrumb"></div>
        <div class="content-toolbar">
          <button id="edit-toggle-btn" type="button" class="icon-btn" aria-pressed="false" title="Edit" aria-label="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
          <button id="save-btn" type="button" class="icon-btn" title="Save" aria-label="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
          <button id="delete-btn" type="button" class="icon-btn danger" title="Delete" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
          <button id="entry-graph-btn" type="button" class="icon-btn" title="Entry graph" aria-label="Entry graph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="6" x2="12" y2="18"></line>
              <line x1="12" y1="18" x2="18" y2="6"></line>
              <line x1="6" y1="6" x2="18" y2="6"></line>
              <circle cx="6" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <circle cx="18" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <div id="markdown-toolbar" class="markdown-toolbar">
            <button type="button" class="icon-btn" data-md-action="undo" title="Undo" aria-label="Undo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 14 4 9 9 4"></polyline>
                <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="redo" title="Redo" aria-label="Redo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 14 20 9 15 4"></polyline>
                <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
              </svg>
            </button>
            <select id="heading-select" data-md-heading title="Block style" aria-label="Block style">
              <option value="0">Normal</option>
              <option value="1">Heading 1</option>
              <option value="2">Heading 2</option>
              <option value="3">Heading 3</option>
            </select>
            <button type="button" class="icon-btn" data-md-action="bold" title="Bold" aria-label="Bold">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="italic" title="Italic" aria-label="Italic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="4" x2="10" y2="4"></line>
                <line x1="14" y1="20" x2="5" y2="20"></line>
                <line x1="15" y1="4" x2="9" y2="20"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="underline" title="Underline" aria-label="Underline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
                <line x1="4" y1="21" x2="20" y2="21"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="strikethrough" title="Strikethrough" aria-label="Strikethrough">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 4H9a3 3 0 0 0-2.83 4"></path>
                <path d="M14 12a4 4 0 0 1 0 8H6"></path>
                <line x1="4" y1="12" x2="20" y2="12"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="link" title="Link" aria-label="Link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="image" title="Image" aria-label="Image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="bullet-list" title="Bulleted list" aria-label="Bulleted list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="9" y1="6" x2="20" y2="6"></line>
                <line x1="9" y1="12" x2="20" y2="12"></line>
                <line x1="9" y1="18" x2="20" y2="18"></line>
                <line x1="4" y1="6" x2="4.01" y2="6"></line>
                <line x1="4" y1="12" x2="4.01" y2="12"></line>
                <line x1="4" y1="18" x2="4.01" y2="18"></line>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="numbered-list" title="Numbered list" aria-label="Numbered list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="10" y1="6" x2="21" y2="6"></line>
                <line x1="10" y1="12" x2="21" y2="12"></line>
                <line x1="10" y1="18" x2="21" y2="18"></line>
                <path d="M4 6h1v4"></path>
                <path d="M4 10h2"></path>
                <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="blockquote" title="Blockquote" aria-label="Blockquote">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 7h4v4a4 4 0 0 1-4 4H6"></path>
                <path d="M15 7h4v4a4 4 0 0 1-4 4h-1"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="inline-code" title="Inline code" aria-label="Inline code">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
            </button>
            <button type="button" class="icon-btn" data-md-action="code-block" title="Code block" aria-label="Code block">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <polyline points="9 9 7 12 9 15"></polyline>
                <polyline points="15 9 17 12 15 15"></polyline>
              </svg>
            </button>
          </div>
        </div>
        <div id="entry-header">
          <div id="entry-icon" class="entry-avatar" aria-hidden="true"></div>
          <div id="entry-header-fields">
            <input id="entry-title" type="text" placeholder="Entry title" readonly>
            <input id="entry-summary" type="text" placeholder="One-line summary" readonly>
          </div>
        </div>
        <div id="entry-tags"></div>
        <div id="entry-timestamps"></div>

        <div id="entry-content-wrapper">
          <div id="entry-content-overlay" aria-hidden="true"></div>
          <textarea id="entry-content" placeholder="Write markdown here..." spellcheck="false" readonly></textarea>
        </div>
        <div id="entry-content-preview" class="markdown-preview" hidden></div>
        <div id="editor-footer">
          <span>Markdown</span>
          <span aria-hidden="true"> · </span>
          <span id="editor-word-count">0 words</span>
        </div>
        <div id="wikilink-autocomplete" hidden></div>
      </div>
    </section>

    <nav id="right-rail" aria-label="Entry panels">
      <button id="rail-outline-toggle-btn" type="button" class="rail-btn" data-panel="outline" title="Outline" aria-label="Toggle outline panel" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
      <button id="rail-backlinks-toggle-btn" type="button" class="rail-btn" data-panel="backlinks" title="Backlinks" aria-label="Toggle backlinks panel" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>
      <button id="rail-entry-graph-toggle-btn" type="button" class="rail-btn" data-panel="entry-graph" title="Relation graph" aria-label="Toggle entry relation graph panel" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" y1="6" x2="12" y2="18"></line>
          <line x1="12" y1="18" x2="18" y2="6"></line>
          <line x1="6" y1="6" x2="18" y2="6"></line>
          <circle cx="6" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <circle cx="18" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </nav>

    <aside id="right-panel" hidden>
      <div id="outline-panel" class="side-panel" hidden>
        <h3 class="side-panel-title">Outline</h3>
        <div id="outline-panel-body"></div>
      </div>
      <div id="backlinks-panel" class="side-panel" hidden>
        <h3 class="side-panel-title">Links</h3>
        <div id="backlinks-panel-body"></div>
      </div>
      <div id="entry-graph-panel" class="side-panel" hidden>
        <h3 class="side-panel-title">Relation graph</h3>
        <svg id="entry-graph-panel-canvas"></svg>
      </div>
    </aside>
  </main>

  <div id="graph-modal" class="modal-overlay" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="graph-modal-title"></h2>
        <div class="modal-header-actions">
          <button id="graph-recenter-btn" type="button" class="icon-btn" title="Recenter view" aria-label="Recenter view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
            </svg>
          </button>
          <button id="graph-modal-close" type="button" class="icon-btn" aria-label="Close">×</button>
        </div>
      </div>
      <svg id="graph-canvas"></svg>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/wikilink-parser.js"></script>
  <script src="js/link-preview.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/backlinks.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
